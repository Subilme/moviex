name: moviex
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.9.0
  cupertino_ui: ^1.1.5

  collection: ^1.19.1
  go_router: ^18.1.2
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  dio: ^5.11.1
  gap: ^3.0.1

  # Logs
  talker: ^5.2.0
  talker_flutter: ^5.2.0
  talker_dio_logger: ^5.2.0
  talker_riverpod_logger: ^5.2.0

  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  go_router_builder: ^4.5.3
  riverpod_annotation: ^4.0.7
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  hive_ce_generator: ^1.12.1

